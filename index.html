<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>身体運動のメカニズム 2025過去問</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centered question card under a sticky control bar; chips filter by lecture */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --fg:#1B2430; --muted:#5F6B7A; --line:#D9DFE6;
  --accent:#2D5B8A; --accent-soft:#E2EBF4;
  --ok:#1F7A4D; --ok-soft:#E1F2E8; --ng:#B3372F; --ng-soft:#F8E3E1;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1A212B; --fg:#E6EBF1; --muted:#9AA6B4; --line:#2C3644;
  --accent:#7FA9D6; --accent-soft:#1F2D3D;
  --ok:#5FC08E; --ok-soft:#173326; --ng:#F08A80; --ng-soft:#3A1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1A212B; --fg:#E6EBF1; --muted:#9AA6B4; --line:#2C3644;
  --accent:#7FA9D6; --accent-soft:#1F2D3D;
  --ok:#5FC08E; --ok-soft:#173326; --ng:#F08A80; --ng-soft:#3A1F1D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header h1{font-size:1.45rem;font-weight:900;margin:0;text-wrap:balance;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.panel{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.08em;font-weight:700;min-width:4.5em}
.chip,.seg button,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn:hover,.chip:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tag{font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.06em}
.q{font-size:1.05rem;margin:0}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;padding:0 4px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .k{font-family:var(--font-mono);color:var(--muted);font-size:.8rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.reveal{font:inherit;padding:12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer}
.ans{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.ans .verdict{font-weight:900}
.ans .verdict.ok{color:var(--ok)} .ans .verdict.ng{color:var(--ng)}
.ans .a{font-size:1.15rem;font-weight:900}
.ans .ex{color:var(--muted);font-size:.92rem;margin:0}
.self{display:flex;gap:8px;flex-wrap:wrap}
.self .btn.ok{border-color:var(--ok);color:var(--ok)} .self .btn.ng{border-color:var(--ng);color:var(--ng)}
.nav{display:flex;justify-content:space-between;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700;padding:8px 20px}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .score{font-family:var(--font-mono);font-size:2.4rem;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>身体運動のメカニズム 2025過去問</h1>
    <p>2025年度 中間テストの全70問。選択肢は本番と同じ並び順です。</p>
  </header>

  <section class="panel" aria-label="出題設定">
    <div class="row"><span class="label">範囲</span><div class="row" id="chips"></div></div>
    <div class="row"><span class="label">形式</span>
      <div class="seg" role="group" aria-label="形式">
        <button id="m-choice" aria-pressed="true">選択式（過去問形式）</button>
        <button id="m-recall" aria-pressed="false">一問一答（答えを隠す）</button>
      </div>
    </div>
    <div class="row"><span class="label">順番</span>
      <div class="seg" role="group" aria-label="順番">
        <button id="o-order" aria-pressed="true">本番の順</button>
        <button id="o-shuffle" aria-pressed="false">ランダム</button>
      </div>
      <button class="btn" id="restart">最初から</button>
    </div>
  </section>

  <div class="status"><span id="pos" class="num">1 / 1</span><div class="bar"><span id="barfill"></span></div><span id="score" class="num">正解 0</span></div>

  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const CH = ["骨・筋・関節","筋の仕組み","筋腱複合体","神経系","反射","体力・加齢","発育発達","トレーニング","サービス問題"];
// [章, 問題文, 正解, 選択肢（本番の並び順）, 解説]
const Q = [
["トレーニング","一般的なトレーニングの原則は5つあり、”目的を明確にしてトレーニングを実施すること”を【①】の原則と呼ぶ。①に該当する名称を答えよ。","意識性",["意識性","個別性","全面性","反復性","漸進性"],"5原則：意識性（目的を明確に）・個別性（自分のレベルに合わせて）・反復性（継続して）・漸進性（徐々に負荷を高めて）・全面性（バランスよく）。"],
["体力・加齢","我々は歳を取ると体力要素が低下する。特に、加齢による影響を大きく受けるのは新体力テストで評価される体力要素のうち【①】である。【①】は長い時間動き続けるために必要な体力であり、長い時間動き続けるためにはエネルギー源の一つである脂質の代謝能力を高める必要がある。①に該当する名称を答えよ。","全身持久力",["筋持久力","全身持久力","走力","敏捷性"],"全身持久力の指標が酸素摂取量（最大酸素摂取量）。脂質を利用してエネルギーを作り出す能力を表す。"],
["神経系","身体運動の直接的な原動力は骨格筋の収縮であるが、その背景には複雑な神経系が関与している。そのため、神経系の理解は運動を理解するために必要である。その中で、神経系は脳や脊髄の【①】、体性神経系と自律神経系の【②】から成る。①に該当する名称を答えよ。","中枢神経系",["中枢神経系","末梢神経系","迷路神経系","反射神経系"],"脳・脊髄＝中枢神経系、体性神経系・自律神経系＝末梢神経系。"],
["骨・筋・関節","全身には筋が600以上もあるとされる。そのうち、下腿部（膝から足首まで）に筋腹をもつ筋を答えよ。","腓腹筋",["大腿直筋","腓腹筋","腹直筋","カレイ筋"],"腓腹筋はふくらはぎの表層の筋。大腿直筋は大腿部、腹直筋は腹部。"],
["骨・筋・関節","関節運動の主な働きを担う筋を【①】と呼ぶ。①に入る名称を答えよ。","主動筋",["拮抗筋","主動筋","自動筋","実働筋"],"主動筋が短縮することで引き伸ばされる筋が拮抗筋。例：肘を曲げるとき、上腕二頭筋が主動筋、上腕三頭筋が拮抗筋。"],
["体力・加齢","体力を大きく分類すると、環境に働きかけて積極的によりよく生きてゆくために必要な体力である【①】と、生存のために最小限必要な体力である生存力の２つに分けることができる。さらに【①】を細かく分類したうち、筋活動によって発揮されるエネルギーの大きさを決める能力を【②】と呼ぶ。②に該当する名称を答えよ。","エネルギー的体力",["サイバネテックス的体力","エナジェティクス的体力","エネルギー的体力","運動能力"],"行動力は、エネルギーの大きさを決める「エネルギー的体力」と、エネルギーの使い方を調整する「サイバネテックス的体力」に分けられる。"],
["筋の仕組み","ミオシンとアクチンの重なり具合によって、筋線維で発揮される力は変化する。特に、適度なミオシンとアクチンが重なり合った状態にあり、相対的に大きな力を発揮できる筋線維の長さの範囲を【①】と呼ぶ。①に該当する名称を答えよ。","至適長",["私的長","快適長","至適長","幸福長"],"筋が短すぎても長すぎても発揮できる力は小さくなる（長さ－張力関係）。"],
["トレーニング","一般的なトレーニングの原則は5つあり、そのうちの一つで、”徐々に負荷を高めてトレーニングを実施する”ことを【①】の原則と呼ぶ。①に該当する名称を答えよ。","漸進性",["意識性","個別性","全面性","反復性","漸進性"],"漸進性＝徐々に負荷を高める。過負荷の原理（原理）と混同しないように。"],
["体力・加齢","脂質を代謝する際には酸素を体内に取り込む必要があり、単位時間あたりに体内へ取り込んだ酸素の量を【①】と呼ぶ。①に該当する名称を答えよ。","酸素摂取量",["酸素消費量","酸素取込量","酸素摂取量","酸素吸引量"],"V̇O₂。その最大値が最大酸素摂取量で、全身持久力の指標になる。"],
["発育発達","スキャモンの発育曲線は、成人時の器官の体積に対する臓器の相対値を示している。そのうち、生殖器、乳房、咽頭などが発育する過程は【①】と呼ばれる。①に該当する名称を答えよ。","生殖型",["生殖型","リンパ型","神経型","一般型"],"思春期に急激に発育する。スキャモンの4型：一般型・神経型・リンパ型・生殖型。"],
["発育発達","スキャモンの発育曲線は、成人時の器官の体積に対する臓器の相対値を示している。そのうち、身長や体重、筋肉などが発育する過程は【①】と呼ばれる。①に該当する名称を答えよ。","一般型",["リンパ型","一般型","神経型","生殖型"],"乳幼児期と思春期の2回、大きく伸びるS字型の曲線。"],
["発育発達","発育の過程において身長の急激な伸びによって、一時的に動作習得が停滞する時期を【①】と呼ぶ。①に該当する名称を答えよ。","クラムジー",["スランプ","トランプ","クラムジー","クランプ"],"身長が急に伸びるPHV（最大発育速度）の時期に起こりやすい。"],
["筋腱複合体","腱の硬さを評価する指標であり、腱の伸張量あたりに作用する力を【①】と呼ぶ。①に該当する名称を答えよ。","スティフネス",["スティフネス","コンプライアンス","ガバナンス","コミットメント"],"スティフネス＝力÷伸張量（硬さ）。逆数のコンプライアンス＝伸張量÷力（柔らかさ）。"],
["筋腱複合体","筋腱が収縮する前に一度伸張し、伸張から短縮に素早く切り替わることで、短縮よりも大きな力を出すことができる運動様式を【①】と呼ぶ。①に該当する名称を答えよ。","伸張-短縮サイクル",["垂直跳び","ばね作用","PDCAサイクル","伸張-短縮サイクル"],"SSC（Stretch-Shortening Cycle）。腱の弾性エネルギーや伸張反射を利用する。"],
["骨・筋・関節","短く数の多い筋線維が鳥の羽のように斜めに走行する形状をした筋を【①】と呼ぶ。①に該当する名称を答えよ。","羽状筋",["羽状筋","紡錘状筋","鋸筋","多裂筋"],"紡錘状筋＝最も筋らしい基本形。鋸筋＝起始がのこぎりの歯のように広がる。"],
["反射","身体は随意的にだけではなく、反射的にも運動する。その代表例に膝蓋腱反射がある。膝蓋腱反射では、膝蓋腱を強く叩くことによって大腿四頭筋が強制的に伸張される。この筋の伸張を大腿四頭筋に内包されるセンサーで筋の伸長を感知し、Ia線維を通して電位が脊髄へ伝達することで大腿四頭筋を収縮させ、筋の損傷を防ぐ機能を持つ。また、大腿四頭筋の収縮によって膝関節の伸展を滞りなく行うためには、膝関節屈曲筋群の大腿二頭筋に代表される大腿部後面の筋群を弛緩させることが必要である。このように、大腿前部の伸長を感知するセンサーから伝わった電位が抑制性の介在ニューロンを経て、大腿後部の筋を弛緩させる反応を【①】と呼ぶ。①に該当する名称を答えよ。","相反神経支配",["相反神経支配","双方神経支配","相互神経支配","逆神経支配"],"主動筋が収縮するとき、抑制性介在ニューロンを介して拮抗筋を弛緩させるしくみ。"],
["神経系","筋の収縮は、脳や脊髄からα運動ニューロンを通して電位が筋線維に伝播することで生じる。この際、1秒間におけるニューロンの発火回数を【①】と呼ぶ。①に該当する名称を答えよ。","発火頻度",["伝播頻度","発火速度","発火頻度","発火スピード"],"発火頻度が高いほど大きな力を発揮できる。力の調節は、動員する運動単位の数と発火頻度で行う。"],
["筋腱複合体","実際には、筋は骨に付着しているわけではなく、腱が付着している。この筋と腱の総体を【①】と呼ぶ。①に該当する名称を答えよ。","筋腱複合体",["筋腱混合体","筋腱移行部","筋腱複合体","筋腱接合部"],"MTC（Muscle-Tendon Complex）。"],
["骨・筋・関節","筋が収縮することで関節周りに骨を回転させるためには、筋が関節をまたいで骨に付着しなければならない。特に、からだの中心から遠い側の付着部を【①】と呼ぶ。①に該当する名称を答えよ。","停止",["停止","起始","指揮","留筋"],"中心に近い側＝起始、遠い側＝停止。"],
["筋の仕組み","筋は閾値より小さな刺激には反応せず、閾値以上の刺激に最大収縮する法則がある。この法則を【①】と呼ぶ。①に該当する名称を答えよ。","全か無かの法則",["1か0かの法則","有か無かの法則","100か0かの法則","全か無かの法則"],"単一の筋線維（運動単位）は、収縮するかしないかのどちらかになる。"],
["骨・筋・関節","筋が収縮することで関節周りに骨を回転させるためには、筋が関節をまたいで骨に付着しなければならない。特に、からだの中心に近い側の付着部を【①】と呼ぶ。①に該当する名称を答えよ。","起始",["停止","留筋","指揮","起始"],"起始に近い方の筋の部分が筋頭、停止に近い方が筋尾。"],
["骨・筋・関節","骨格のうち、下腿部（膝から足首まで）は脛骨と【①】の2つ骨から構成されている。①に該当する骨の名称を答えよ。","腓骨",["膝蓋骨","頭蓋骨","大腿骨","腓骨"],"脛骨が内側（太い骨）、腓骨が外側（細い骨）。"],
["筋の仕組み","筋が力を発揮しながらも筋の長さが変わらない場合の筋の収縮様式を【①】と呼ぶ。①に該当する名称を答えよ。","等尺性収縮",["短縮性収縮","等尺性収縮","伸張性収縮","等速性収縮"],"アイソメトリック収縮。力の向きと収縮の向きが同じ＝短縮性、逆＝伸張性。"],
["反射","身体は随意的にだけではなく、反射的にも運動する。その代表例に膝蓋腱反射がある。膝蓋腱反射では、膝蓋腱を強く叩くことによって大腿四頭筋が強制的に伸張される。この筋の伸張を【①】で感知し、Ia線維を通して電位が脊髄へ伝達することで大腿四頭筋を収縮させ、筋の損傷を防ぐ機能を持つ。①に該当する名称を答えよ。","筋紡錘",["紡錘筋","筋センサー","伸張受容器","筋紡錘"],"筋紡錘は骨格筋に内包される感覚受容器で、筋の長さの変化を感知する。腱にあるゴルジ腱器官と区別する。"],

const st={chapters:new Set(CH),mode:"choice",shuffle:false,list:[],i:0,correct:0,answered:false};
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function buildChips(){
  const box=$("#chips");box.innerHTML="";
  const all=document.createElement("button");all.className="chip";all.textContent="すべて";
  all.setAttribute("aria-pressed",st.chapters.size===CH.length);
  all.onclick=()=>{st.chapters=new Set(CH);start()};box.append(all);
  CH.forEach(c=>{const n=Q.filter(q=>q[0]===c).length;const b=document.createElement("button");b.className="chip";
    b.textContent=`${c}（${n}）`;b.setAttribute("aria-pressed",st.chapters.size<CH.length&&st.chapters.has(c));
    b.onclick=()=>{if(st.chapters.size===CH.length)st.chapters=new Set([c]);else if(st.chapters.has(c)){st.chapters.delete(c);if(!st.chapters.size)st.chapters=new Set(CH)}else st.chapters.add(c);start()};
    box.append(b)});
}
function start(list){
  buildChips();
  let l=list||Q.filter(q=>st.chapters.has(q[0]));
  if(st.shuffle)l=shuf(l);
  st.list=l.map(q=>({q,opts:q[3],res:null}));st.i=0;st.correct=0;render();
}
function status(){
  $("#pos").textContent=`${Math.min(st.i+1,st.list.length)} / ${st.list.length}`;
  $("#score").textContent=`正解 ${st.correct}`;
  $("#barfill").style.width=`${st.i/st.list.length*100}%`;
}
function render(){
  status();const card=$("#card");
  if(st.i>=st.list.length){return finish()}
  const it=st.list[st.i],[ch,text,ans,,ex]=it.q;
  const qhtml=esc(text).replace(/【([①②])】/g,'<span class="blank">$1</span>');
  card.innerHTML=`<div class="tag">${ch}</div><p class="q">${qhtml}</p><div id="body"></div><div id="after"></div>`;
  const body=$("#body");
  if(st.mode==="choice"){
    body.className="opts";
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";
      b.innerHTML=`<span class="k">${"ABCDEF"[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===ans;it.res=ok;if(ok)st.correct++;
        body.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(it.opts[j]===ans)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
        showAnswer(ok);};
      body.append(b)});
  }else{
    const r=document.createElement("button");r.className="reveal";r.textContent="答えを見る";
    r.onclick=()=>{r.remove();showAnswer(null)};body.append(r);
  }
  function showAnswer(ok){
    const a=$("#after");
    const v=ok===null?"":`<div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</div>`;
    a.innerHTML=`<div class="ans">${v}<div class="a">${esc(ans)}</div><p class="ex">${esc(ex)}</p></div>`;
    if(ok===null){
      const s=document.createElement("div");s.className="self";
      s.innerHTML=`<button class="btn ok">わかった</button><button class="btn ng">わからなかった</button>`;
      const [y,n]=s.querySelectorAll("button");
      y.onclick=()=>{it.res=true;st.correct++;next()};n.onclick=()=>{it.res=false;next()};
      a.append(s);
    }else{
      const nav=document.createElement("div");nav.className="nav";
      nav.innerHTML=`<span></span><button class="btn primary">次へ</button>`;
      nav.querySelector("button").onclick=next;a.append(nav);nav.querySelector("button").focus();
    }
    status();
  }
}
function next(){st.i++;render()}
function finish(){
  const wrong=st.list.filter(x=>x.res===false).map(x=>x.q);
  const card=$("#card");
  card.innerHTML=`<div class="done"><div class="tag">結果</div><div class="score">${st.correct} / ${st.list.length}</div>
    <p style="margin:0;color:var(--muted)">${wrong.length?`間違えた問題が${wrong.length}問あります。`:"全問正解です。"}</p>
    <div class="row" style="justify-content:center">${wrong.length?'<button class="btn primary" id="retry">間違えた問題だけ解き直す</button>':""}<button class="btn" id="again">もう一度</button></div></div>`;
  $("#barfill").style.width="100%";
  if(wrong.length)$("#retry").onclick=()=>start(wrong);
  $("#again").onclick=()=>start();
}
function seg(a,b,on){$(a).setAttribute("aria-pressed",on);$(b).setAttribute("aria-pressed",!on)}
$("#m-choice").onclick=()=>{st.mode="choice";seg("#m-choice","#m-recall",true);start()};
$("#m-recall").onclick=()=>{st.mode="recall";seg("#m-choice","#m-recall",false);start()};
$("#o-order").onclick=()=>{st.shuffle=false;seg("#o-order","#o-shuffle",true);start()};
$("#o-shuffle").onclick=()=>{st.shuffle=true;seg("#o-order","#o-shuffle",false);start()};
$("#restart").onclick=()=>start();
start();
</script>
</body>
</html>
